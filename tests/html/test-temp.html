        async function loadAndPlay() {

            lyricsDiv.innerHTML = timingData.lines.map((line, idx) => 
                `<div id="line-${idx}" style="padding: 5px; margin: 5px 0;">${line.line}</div>`

            audio.addEventListener('timeupdate', () => {

                const activeLine = timingData.lines.findIndex((line, idx) => {
