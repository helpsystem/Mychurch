<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 تست TTS فارسی - Hugging Face</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .voice-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .voice-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .voice-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .char-count {
            text-align: left;
            color: #999;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .samples {
            margin-bottom: 20px;
        }
        
        .samples h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .sample-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background: #f5f5f5;
            border: none;
            border-radius: 5px;
            text-align: right;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .sample-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.playing {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.success {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .hidden {
            display: none;
        }
        
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid #667eea;
        }
        
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .info ul {
            margin-right: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .info li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 تست TTS فارسی</h1>
        <p class="subtitle">Hugging Face API - مدل‌های Kamtera</p>
        
        <!-- Voice Selector -->
        <div class="voice-selector">
            <button class="voice-btn active" onclick="selectVoice('female')">
                👩 صدای زن
            </button>
            <button class="voice-btn" onclick="selectVoice('male')">
                👨 صدای مرد
            </button>
        </div>
        
        <!-- Text Input -->
        <textarea id="textInput" placeholder="متن فارسی خود را اینجا وارد کنید..." maxlength="1000">سلام! این یک تست صدای فارسی با کیفیت بالا است.</textarea>
        <div class="char-count"><span id="charCount">54</span> / 1000</div>
        
        <!-- Sample Texts -->
        <div class="samples">
            <h3>متن‌های نمونه:</h3>
            <button class="sample-btn" onclick="setSampleText(0)">سلام! این یک تست صدای فارسی با کیفیت بالا است.</button>
            <button class="sample-btn" onclick="setSampleText(1)">خداوند شما را برکت دهد و نگاه دارد.</button>
            <button class="sample-btn" onclick="setSampleText(2)">در ابتدا خدا آسمان‌ها و زمین را آفرید.</button>
            <button class="sample-btn" onclick="setSampleText(3)">محبت صبور است، محبت مهربان است.</button>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="speakBtn" onclick="speak()">▶️ پخش</button>
            <button class="btn btn-secondary" id="stopBtn" onclick="stop()" disabled>⏹️ توقف</button>
        </div>
        
        <!-- Status -->
        <div id="status" class="status hidden"></div>
        
        <!-- Info -->
        <div class="info">
            <h3>ℹ️ نکات مهم:</h3>
            <ul>
                <li>اولین بار ممکن است 20-30 ثانیه طول بکشد</li>
                <li>بعد از اولین بار، سریع است (Cache)</li>
                <li>حداکثر 1000 کاراکتر</li>
                <li>کیفیت بسیار عالی ⭐⭐⭐⭐⭐</li>
            </ul>
        </div>
    </div>

    <script>
        let currentVoice = 'female';
        let currentAudio = null;
        
        const sampleTexts = [
            'سلام! این یک تست صدای فارسی با کیفیت بالا است.',
            'خداوند شما را برکت دهد و نگاه دارد.',
            'در ابتدا خدا آسمان‌ها و زمین را آفرید.',
            'محبت صبور است، محبت مهربان است.'
        ];
        
        // Update character count
        document.getElementById('textInput').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });
        
        function selectVoice(voice) {
            currentVoice = voice;
            document.querySelectorAll('.voice-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function setSampleText(index) {
            const textarea = document.getElementById('textInput');
            textarea.value = sampleTexts[index];
            document.getElementById('charCount').textContent = textarea.value.length;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.classList.remove('hidden');
        }
        
        function hideStatus() {
            document.getElementById('status').classList.add('hidden');
        }
        
        async function speak() {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                showStatus('❌ لطفاً متنی وارد کنید', 'error');
                return;
            }
            
            if (text.length > 1000) {
                showStatus('❌ متن بیش از حد طولانی است', 'error');
                return;
            }
            
            // Stop current audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            // Disable buttons
            document.getElementById('speakBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            
            showStatus('⏳ در حال تولید صدا... (اولین بار کمی طول می‌کشد)', 'loading');
            
            try {
                const response = await fetch('/api/tts/huggingface/synthesize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: currentVoice
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'خطا در تولید صدا');
                }
                
                // Create audio element
                currentAudio = new Audio(data.audioUrl);
                
                currentAudio.onloadstart = () => {
                    showStatus('🔊 در حال بارگذاری...', 'loading');
                };
                
                currentAudio.onplay = () => {
                    showStatus('▶️ در حال پخش...', 'playing');
                    document.getElementById('stopBtn').disabled = false;
                };
                
                currentAudio.onended = () => {
                    showStatus('✅ پخش تمام شد', 'success');
                    document.getElementById('speakBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    currentAudio = null;
                    setTimeout(hideStatus, 3000);
                };
                
                currentAudio.onerror = () => {
                    showStatus('❌ خطا در پخش صدا', 'error');
                    document.getElementById('speakBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    currentAudio = null;
                };
                
                // Play audio
                await currentAudio.play();
                
            } catch (error) {
                console.error('TTS Error:', error);
                
                let errorMessage = '❌ خطا: ';
                if (error.message.includes('Model is loading')) {
                    errorMessage += 'مدل در حال بارگذاری است. 20 ثانیه صبر کنید و دوباره امتحان کنید.';
                } else if (error.message.includes('Network') || error.message.includes('Failed to fetch')) {
                    errorMessage += 'خطای شبکه. Backend را چک کنید: http://localhost:3001/api/tts/huggingface/health';
                } else if (error.message.includes('Not Found') || (error.response && error.response.status === 404)) {
                    errorMessage += 'API پیدا نشد. Backend را restart کنید.';
                } else {
                    errorMessage += error.message;
                }
                
                showStatus(errorMessage, 'error');
                document.getElementById('speakBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        function stop() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            showStatus('⏹️ پخش متوقف شد', 'success');
            document.getElementById('speakBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            setTimeout(hideStatus, 2000);
        }
    </script>
</body>
</html>
