<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Audio & Timing - Iranian Church</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #16213e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #0f3460;
        }
        h2 {
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #2d5016; border-left: 4px solid #4caf50; }
        .error { background: #5e1515; border-left: 4px solid #f44336; }
        .info { background: #1a3d5c; border-left: 4px solid #2196f3; }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #c23250; }
        audio { width: 100%; margin: 10px 0; }
        .lyrics {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .highlight { background: yellow; color: black; font-weight: bold; }
        code {
            background: #000;
            padding: 2px 6px;
            border-radius: 3px;
            color: #4caf50;
        }
    </style>
</head>
<body>
    <h1>🎵 تست سیستم صوتی و Timing</h1>
    
    <div class="test-section">
        <h2>1️⃣ تست دسترسی به فایل صوتی</h2>
        <button onclick="testAudioAccess()">🔍 بررسی دسترسی</button>
        <div id="audioTest"></div>
    </div>

    <div class="test-section">
        <h2>2️⃣ تست فایل Timing</h2>
        <button onclick="testTimingAccess()">📊 بررسی Timing</button>
        <div id="timingTest"></div>
    </div>

    <div class="test-section">
        <h2>3️⃣ پخش صوت با Timing</h2>
        <audio id="audioPlayer" controls></audio>
        <button onclick="loadAndPlay()">▶️ بارگذاری و پخش</button>
        <div class="lyrics" id="lyrics">
            متن آهنگ اینجا نمایش داده می‌شود...
        </div>
        <div id="syncStatus"></div>
    </div>

    <div class="test-section">
        <h2>4️⃣ Console Logs</h2>
        <div id="console" style="background: #000; padding: 10px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script>
        const audioUrl = '/worship/audio/kalameh/El Shaddai in Farsi.mp3';
        const timingUrl = '/worship/data/timings/song_1_timing.json';
        let timingData = null;
        let currentWordIndex = -1;

        // Custom console
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const consoleDiv = document.getElementById('console');
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            consoleDiv.innerHTML += `<div style="color: #4caf50;">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        console.error = function(...args) {
            const consoleDiv = document.getElementById('console');
            const message = args.join(' ');
            consoleDiv.innerHTML += `<div style="color: #f44336;">[ERROR] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        async function testAudioAccess() {
            const div = document.getElementById('audioTest');
            div.innerHTML = '<div class="info">⏳ در حال بررسی...</div>';
            
            console.log('🔍 Testing audio file:', audioUrl);
            
            try {
                const response = await fetch(audioUrl, { method: 'HEAD' });
                console.log('Audio response:', {
                    status: response.status,
                    headers: {
                        contentType: response.headers.get('content-type'),
                        contentLength: response.headers.get('content-length')
                    }
                });
                
                if (response.ok) {
                    const size = response.headers.get('content-length');
                    div.innerHTML = `
                        <div class="success">
                            ✅ فایل صوتی در دسترس است<br>
                            📁 مسیر: <code>${audioUrl}</code><br>
                            📊 حجم: ${(parseInt(size) / 1024 / 1024).toFixed(2)} MB<br>
                            🎵 نوع: ${response.headers.get('content-type')}
                        </div>
                    `;
                } else {
                    div.innerHTML = `<div class="error">❌ فایل پیدا نشد - HTTP ${response.status}</div>`;
                }
            } catch (error) {
                console.error('Audio test failed:', error);
                div.innerHTML = `<div class="error">❌ خطا: ${error.message}</div>`;
            }
        }

        async function testTimingAccess() {
            const div = document.getElementById('timingTest');
            div.innerHTML = '<div class="info">⏳ در حال بررسی...</div>';
            
            console.log('🔍 Testing timing file:', timingUrl);
            
            try {
                const response = await fetch(timingUrl);
                console.log('Timing response:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    timingData = data;
                    console.log('Timing data loaded:', {
                        title: data.metadata?.title,
                        wordCount: data.words?.length,
                        lineCount: data.lines?.length,
                        duration: data.metadata?.totalDuration
                    });
                    
                    div.innerHTML = `
                        <div class="success">
                            ✅ فایل Timing موجود است<br>
                            📝 عنوان: ${data.metadata?.title || 'N/A'}<br>
                            🎤 خواننده: ${data.metadata?.artist || 'N/A'}<br>
                            ⏱️ مدت: ${data.metadata?.totalDuration?.toFixed(2)} ثانیه<br>
                            📊 تعداد کلمات: ${data.words?.length || 0}<br>
                            📄 تعداد خطوط: ${data.lines?.length || 0}<br>
                            <details style="margin-top: 10px;">
                                <summary>مشاهده نمونه</summary>
                                <pre style="background: #000; padding: 10px; overflow-x: auto; font-size: 11px;">${JSON.stringify(data.lines?.[0], null, 2)}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    div.innerHTML = `<div class="error">❌ فایل Timing پیدا نشد - HTTP ${response.status}</div>`;
                }
            } catch (error) {
                console.error('Timing test failed:', error);
                div.innerHTML = `<div class="error">❌ خطا: ${error.message}</div>`;
            }
        }

        async function loadAndPlay() {
            const audio = document.getElementById('audioPlayer');
            const lyricsDiv = document.getElementById('lyrics');
            const statusDiv = document.getElementById('syncStatus');
            
            console.log('▶️ Loading and playing audio...');
            
            if (!timingData) {
                statusDiv.innerHTML = '<div class="error">❌ ابتدا Timing را تست کنید</div>';
                return;
            }
            
            audio.src = audioUrl;
            audio.load();
            
            // نمایش متن آهنگ
            lyricsDiv.innerHTML = timingData.lines.map((line, idx) => 
                `<div id="line-${idx}" style="padding: 5px; margin: 5px 0;">${line.line}</div>`
            ).join('');
            
            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;
                
                // پیدا کردن خط فعال
                const activeLine = timingData.lines.findIndex((line, idx) => {
                    const nextLine = timingData.lines[idx + 1];
                    return currentTime >= line.start && (!nextLine || currentTime < nextLine.start);
                });
                
                // Highlight کردن خط فعال
                timingData.lines.forEach((_, idx) => {
                    const lineEl = document.getElementById(`line-${idx}`);
                    if (lineEl) {
                        if (idx === activeLine) {
                            lineEl.classList.add('highlight');
                            lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        } else {
                            lineEl.classList.remove('highlight');
                        }
                    }
                });
                
                if (activeLine !== currentWordIndex) {
                    currentWordIndex = activeLine;
                    console.log('Current line:', activeLine, timingData.lines[activeLine]?.line);
                }
            });
            
            try {
                await audio.play();
                statusDiv.innerHTML = '<div class="success">✅ در حال پخش با Timing Sync فعال</div>';
            } catch (error) {
                console.error('Play failed:', error);
                statusDiv.innerHTML = `<div class="error">❌ خطا در پخش: ${error.message}</div>`;
            }
        }

        // بارگذاری خودکار در شروع
        window.onload = () => {
            console.log('🚀 Test page loaded');
            console.log('Base URL:', window.location.origin);
        };
    </script>
</body>
</html>
