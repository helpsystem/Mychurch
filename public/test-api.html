<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست API - کتاب مقدس</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            direction: rtl;
        }
        .success { color: #4ade80; font-size: 20px; font-weight: bold; }
        .error { color: #f87171; font-size: 18px; }
        .info { color: #60a5fa; margin: 10px 0; }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .book-card {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }
        .book-card:hover {
            border-color: #4ade80;
        }
        button {
            background: #4ade80;
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 5px;
        }
        button:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <h1>🔬 تست API کتاب مقدس</h1>
    
    <button onclick="testAPI()">دریافت کتاب‌ها از API</button>
    <button onclick="location.reload()">رفرش صفحه</button>
    
    <div id="status" style="margin-top: 20px;"></div>
    <div id="results" class="book-grid"></div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.innerHTML = '<div class="info">⏳ در حال بارگذاری...</div>';
            resultsDiv.innerHTML = '';
            
            try {
                console.log('🚀 Fetching from: /api/bible/books');
                const response = await fetch('/api/bible/books');
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📦 Received data:', data);
                
                if (data.success && data.books && Array.isArray(data.books)) {
                    statusDiv.innerHTML = `<div class="success">✅ موفق! ${data.books.length} کتاب دریافت شد</div>`;
                    
                    if (data.books.length === 0) {
                        resultsDiv.innerHTML = '<div class="error">❌ هیچ کتابی یافت نشد!</div>';
                        return;
                    }
                    
                    resultsDiv.innerHTML = data.books.map((book, index) => `
                        <div class="book-card">
                            <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">
                                ${index + 1}. ${book.name?.fa || book.name?.en || 'بدون نام'}
                            </div>
                            <div style="font-size: 14px; color: #94a3b8;">
                                📚 کد: ${book.key || 'N/A'}<br>
                                📖 فصل‌ها: ${book.chapters || 'نامشخص'}<br>
                                📜 عهد: ${book.testament === 'OT' ? 'عهد عتیق' : book.testament === 'NT' ? 'عهد جدید' : 'نامشخص'}
                            </div>
                            <div style="text-align: left; margin-top: 5px; font-size: 14px; color: #60a5fa;">
                                ${book.name?.en || ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    statusDiv.innerHTML = '<div class="error">❌ خطا: ساختار داده نامعتبر</div>';
                    resultsDiv.innerHTML = `<pre style="background: #0f3460; padding: 15px; border-radius: 8px; overflow: auto;">${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                statusDiv.innerHTML = `<div class="error">❌ خطا: ${error.message}</div>`;
                resultsDiv.innerHTML = `<pre style="background: #0f3460; padding: 15px; border-radius: 8px; color: #f87171;">${error.stack}</pre>`;
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
