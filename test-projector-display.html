<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Projector Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: white;
            font-family: 'Vazirmatn', 'B Nazanin', 'Scheherazade New', 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(168,85,247,0.3), rgba(236,72,153,0.2));
            backdrop-filter: blur(15px);
            padding: 40px 60px;
            text-align: center;
            border-bottom: 4px solid rgba(168,85,247,0.5);
            box-shadow: 0 8px 32px rgba(168,85,247,0.4), 0 0 60px rgba(168,85,247,0.2);
        }
        h1 { 
            font-size: 5.5rem; 
            margin-bottom: 0;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 60px rgba(255,255,255,0.8), 
                         0 0 90px rgba(255,255,255,0.5),
                         0 4px 20px rgba(0,0,0,1),
                         0 8px 40px rgba(0,0,0,0.8);
            font-family: 'Vazirmatn', 'B Nazanin', 'Scheherazade New', 'Arial', sans-serif;
        }
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        .lyrics {
            font-size: 4.8rem;
            line-height: 2.6;
            text-align: center;
            text-shadow: 4px 4px 16px rgba(0,0,0,1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            gap: 50px;
            padding: 0 80px;
        }
        
        .line {
            display: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            width: 100%;
        }
        
        /* خط قبلی */
        .line.previous {
            display: block;
            opacity: 0.4;
            transform: scale(0.85) translateY(-20px);
            font-size: 0.85em;
            color: #9ca3af;
        }
        
        /* خط فعلی */
        .line.active {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
            animation: slideIn 0.8s ease-out;
        }
        
        /* خط بعدی */
        .line.next {
            display: block;
            opacity: 0.35;
            transform: scale(0.8) translateY(20px);
            font-size: 0.75em;
            color: #6b7280;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .word {
            display: inline-block;
            margin: 0 32px;
            padding: 14px 10px;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #f1f5f9;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .line.active .word {
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,255,255,0.3),
                         3px 3px 10px rgba(0,0,0,0.9);
        }
        .line.previous .word,
        .line.next .word {
            margin: 0 24px;
            letter-spacing: 2px;
        }
        .word.active {
            color: #fde047 !important;
            transform: scale(2.2) translateY(-25px);
            font-weight: 900 !important;
            text-shadow: 0 0 70px rgba(253,224,71,1), 
                         0 0 140px rgba(253,224,71,0.95),
                         0 0 210px rgba(253,224,71,0.8),
                         5px 5px 25px rgba(0,0,0,1);
            animation: glow 0.9s ease-in-out infinite;
            filter: brightness(1.5) contrast(1.3);
            letter-spacing: 4px;
        }
        @keyframes glow {
            0%, 100% { 
                text-shadow: 0 0 60px rgba(253,224,71,1), 
                            0 0 120px rgba(253,224,71,0.9),
                            0 0 180px rgba(253,224,71,0.7),
                            4px 4px 20px rgba(0,0,0,1);
            }
            50% { 
                text-shadow: 0 0 80px rgba(253,224,71,1), 
                            0 0 150px rgba(253,224,71,1),
                            0 0 220px rgba(253,224,71,0.8),
                            4px 4px 25px rgba(0,0,0,1);
            }
        }
        

    </style>
</head>
<body>
    <div class="header">
        <h1>الشدای</h1>
    </div>
    
    <div class="content">
        <div class="lyrics" id="lyrics">
            <div class="line" data-line="0">
                <span class="word">الشدای</span>
                <span class="word">الشدای</span>
            </div>
            <div class="line" data-line="1">
                <span class="word">ال</span>
                <span class="word">الــیون</span>
                <span class="word">ادونای</span>
            </div>
            <div class="line" data-line="2">
                <span class="word">هم</span>
                <span class="word">در</span>
                <span class="word">عــالــم</span>
                <span class="word">اعلــی</span>
            </div>
        </div>
    </div>
    

    
    <script>
        let currentLine = -1;
        let currentWord = -1;
        
        function showLine(lineIndex) {
            const lines = document.querySelectorAll('.line');
            lines.forEach((line, idx) => {
                line.classList.remove('previous', 'active', 'next');
                
                if (idx === lineIndex - 1) {
                    line.classList.add('previous'); // خط قبلی
                } else if (idx === lineIndex) {
                    line.classList.add('active'); // خط فعلی
                } else if (idx === lineIndex + 1) {
                    line.classList.add('next'); // خط بعدی
                }
            });
            currentLine = lineIndex;
            console.log('Showing line:', lineIndex);
        }
        
        function highlightWord(wordIndex) {
            if (currentLine === -1) {
                alert('ابتدا یک خط انتخاب کنید');
                return;
            }
            
            // ابتدا همه کلمات را غیرفعال کن
            document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
            
            const activeLine = document.querySelector('.line.active');
            if (!activeLine) return;
            
            const words = activeLine.querySelectorAll('.word');
            if (words[wordIndex]) {
                words[wordIndex].classList.add('active');
            }
            console.log('Highlighting word:', wordIndex);
        }
        
        // Auto demo
        let demoLine = 0;
        let demoWord = 0;
        
        function autoDemo() {
            showLine(demoLine);
            
            const activeLine = document.querySelector('.line.active');
            if (activeLine) {
                const words = activeLine.querySelectorAll('.word');
                
                const wordInterval = setInterval(() => {
                    // پاک کردن همه هایلایت‌ها
                    document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
                    
                    // هایلایت کلمه فعلی
                    if (words[demoWord]) {
                        words[demoWord].classList.add('active');
                    }
                    
                    demoWord++;
                    if (demoWord >= words.length) {
                        clearInterval(wordInterval);
                        demoWord = 0;
                        demoLine++;
                        if (demoLine < 3) {
                            setTimeout(autoDemo, 1000);
                        } else {
                            demoLine = 0;
                            setTimeout(autoDemo, 2000);
                        }
                    }
                }, 800);
            }
        }
        
        // شروع demo خودکار بعد از 2 ثانیه
        setTimeout(autoDemo, 2000);
    </script>
</body>
</html>
