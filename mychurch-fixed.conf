server {
    server_name samanabyar.online www.samanabyar.online;
    root /root/Mychurch/dist;
    index index.html;

    # API Proxy
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static files (JSON, PPTX, etc)
    location ~* \.(json|pptx|pdf|txt|mp3|mp4|jpg|jpeg|png|gif|svg|css|js|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
    }

    # React routes fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/samanabyar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samanabyar.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.samanabyar.online) {
        return 301 https://$host$request_uri;
    }

    if ($host = samanabyar.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name samanabyar.online www.samanabyar.online;
    return 404;
}
