name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            cd /root/mychurch-v2
            git restore . || true
            git clean -df || true
            git checkout main
            git pull origin main || (git fetch origin main && git reset --hard origin/main)
            cd /root/mychurch-v2/mychurch-next
            if [ -d ".next/standalone" ] && [ -d ".next/static" ]; then
                cp -rn public .next/standalone/public || true
                mkdir -p .next/standalone/.next
                cp -rn .next/static .next/standalone/.next/static || true
                if [ -d ".next/standalone/mychurch-next" ]; then
                    cp -rn public .next/standalone/mychurch-next/public || true
                    mkdir -p .next/standalone/mychurch-next/.next
                    cp -rn .next/static .next/standalone/mychurch-next/.next/static || true
                fi
            fi
            if pm2 show mychurch-next > /dev/null 2>&1; then pm2 delete mychurch-next || true; fi
            pm2 start run-server.js --name 'mychurch-next' --max-memory-restart 800M || true
            pm2 save || true
            chmod +x /root/mychurch-v2/mychurch-next/deploy_remote.sh
            /root/mychurch-v2/mychurch-next/deploy_remote.sh
