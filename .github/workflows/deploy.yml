name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/mychurch-v2
            git restore . || true
            git clean -df || true
            git checkout main
            git pull origin main || (git fetch origin main && git reset --hard origin/main)
            chmod +x /root/mychurch-v2/mychurch-next/deploy_remote.sh
            /root/mychurch-v2/mychurch-next/deploy_remote.sh
