version: '3.8'

services:
  # PostgreSQL Database - Production Configuration
  postgres:
    image: postgres:15-alpine
    container_name: mychurch-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mychurch_prod}
      POSTGRES_USER: ${POSTGRES_USER:-mychurch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MyChurchSecureDB2024!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./docker/postgres/init-db-prod.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - mychurch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Redis Cache - Production Configuration
  redis:
    image: redis:7-alpine
    container_name: mychurch-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-MyChurchSecureRedis2024!}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - mychurch-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Backend API - Production Configuration
  backend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        NODE_ENV: production
    container_name: mychurch-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mychurch_admin}:${POSTGRES_PASSWORD:-MyChurchSecureDB2024!}@postgres:5432/${POSTGRES_DB:-mychurch_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-MyChurchSecureRedis2024!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-MyChurchSuperSecretJWTKey2024!LongRandomString}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://mychurch.com}
      API_KEY: ${API_KEY:-MyChurchSecureAPIKey2024!}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HF_API_KEY: ${HF_API_KEY}
      FTP_HOST: ${FTP_HOST}
      FTP_USER: ${FTP_USER}
      FTP_PASS: ${FTP_PASS}
      FTP_PORT: ${FTP_PORT:-21}
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    ports:
      - "3001:3001"
    networks:
      - mychurch-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

  # Frontend Application - Production Configuration
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        NODE_ENV: production
    container_name: mychurch-frontend-prod
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.mychurch.com}
      VITE_APP_NAME: "MyChurch"
      VITE_APP_VERSION: "1.0.0"
    volumes:
      - ./public:/app/public
      - ./build:/app/build
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mychurch-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

  # Nginx Reverse Proxy - Production Configuration
  nginx:
    image: nginx:alpine
    container_name: mychurch-nginx-prod
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - ./public:/var/www/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mychurch-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - KILL

  # Database Backup Service
  backup:
    image: postgres:15-alpine
    container_name: mychurch-backup-prod
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mychurch_prod}
      POSTGRES_USER: ${POSTGRES_USER:-mychurch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MyChurchSecureDB2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - mychurch-network
    command: >
      bash -c "
        echo 'Starting backup service...'
        while true; do
          echo 'Creating backup...'
          pg_dump -U ${POSTGRES_USER:-mychurch_admin} -d ${POSTGRES_DB:-mychurch_prod} > /backups/backup-\$(date +%Y%m%d-%H%M%S).sql
          echo 'Backup completed'
          sleep 86400
        done
      "
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mychurch-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16