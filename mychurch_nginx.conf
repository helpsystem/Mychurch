server {
    listen 80;
    listen [::]:80;
    server_name samanabyar.online www.samanabyar.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samanabyar.online www.samanabyar.online;

    ssl_certificate /etc/letsencrypt/live/samanabyar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samanabyar.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html index.htm;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.alhayatgpt.com https://fonts.googleapis.com https://esm.sh https://cdnjs.cloudflare.com https://www.youtube.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://esm.sh; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; frame-src 'self' https://www.youtube.com https://youtube.com https://www.alhayatgpt.com; connect-src 'self' https://www.alhayatgpt.com https://*.supabase.co wss://*.supabase.co https://api.openai.com https://generativelanguage.googleapis.com https://*.kalameh.com https://*.hidrive.strato.com https://www.youtube.com https://youtu.be; media-src 'self' blob: https: http:;" always;

    location ~ ^/api/hidrive/stream/worship/audio/(.*)$ {
        alias /var/www/html/worship/audio/$1;
        add_header Cache-Control "public, max-age=31536000";
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* /worship/data/timings/.*\.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
