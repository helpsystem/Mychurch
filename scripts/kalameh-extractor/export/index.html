<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرشیو آهنگ‌های عبادت - Worship Songs Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .stats-number {
            font-size: 48px;
            font-weight: bold;
            display: block;
        }
        .stats-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .file-list {
            list-style: none;
        }
        .file-item {
            background: #f8f9fa;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .file-item:hover {
            background: #667eea;
            color: white;
            transform: translateX(-5px);
        }
        .file-item:hover .file-size {
            color: rgba(255,255,255,0.9);
        }
        .file-icon {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-left: 15px;
        }
        .file-item:hover .file-icon {
            background: white;
            color: #667eea;
        }
        .file-info {
            flex: 1;
        }
        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .file-desc {
            font-size: 12px;
            color: #666;
        }
        .file-item:hover .file-desc {
            color: rgba(255,255,255,0.8);
        }
        .file-size {
            color: #999;
            font-size: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 12px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 آرشیو آهنگ‌های عبادت</h1>
        <p class="subtitle">Worship Songs Archive - Iranian Christian Church DC</p>
        
        <div class="stats">
            <span class="stats-number">166</span>
            <span class="stats-label">آهنگ استخراج شده / Extracted Songs</span>
        </div>

        <ul class="file-list">
            <li class="file-item">
                <a href="songs_index.json" style="display: flex; align-items: center; width: 100%;" download>
                    <div class="file-icon">📊</div>
                    <div class="file-info">
                        <div class="file-name">songs_index.json</div>
                        <div class="file-desc">فهرست کامل آهنگ‌ها با دسته‌بندی حروف / Full catalog with letter grouping</div>
                    </div>
                    <div class="file-size">65 KB</div>
                </a>
            </li>
        </ul>

        <div class="footer">
            <p>📅 Last Updated: October 23, 2025</p>
            <p>🌐 <a href="http://samanabyar.online" target="_blank">samanabyar.online</a></p>
        </div>
    </div>

    <script>
        // Optional: Load and display song count from JSON
        fetch('songs_index.json')
            .then(r => r.json())
            .then(data => {
                document.querySelector('.stats-number').textContent = data.total_songs || 166;
            })
            .catch(e => console.log('Could not load JSON:', e));
    </script>
</body>
</html>
